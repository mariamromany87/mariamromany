
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
        }

        .project-images {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
        }

        .project-images img {
            display: block;
            width: 100%;
            height: auto;
        }
    </style>
</head>

<body>

    <div class="project-images">

        <img 
            src="Transfera Case study.png"
        >

       

    </div>
<style>
    .prototype-section {
        width: 100%;
        max-width: 1440px;
        margin: 80px auto;
        padding: 0 40px;
    }

    .prototype-title {
        text-align: center;
        font-size: 32px;
        margin-bottom: 30px;
    }

    .prototype-container {
        width: 100%;
        height: 750px;
        overflow: hidden;
        border-radius: 12px;
    }

    .prototype-container iframe {
        width: 100%;
        height: 100%;
        border: none;
    }

    @media (max-width: 768px) {
        .prototype-section {
            padding: 0 20px;
        }

        .prototype-title {
            font-size: 26px;
        }

        .prototype-container {
            height: 600px;
        }
    }
</style>


<section class="prototype-section">

    <h2 class="prototype-title">
        Interactive Prototype
    </h2>

    <div class="prototype-container">

        <iframe style="border: 1px solid rgba(0, 0, 0, 0.1);" width="800" height="450" src="https://embed.figma.com/proto/qjoLbsFtgJqB68xdo14HQ8/TransFera-%7C-Financial-Technology-App?node-id=346-5375&scaling=scale-down&content-scaling=fixed&page-id=0%3A1&starting-point-node-id=19%3A1356&embed-host=share" allowfullscreen></iframe>

    </div>

</section>
</body>
</html>
